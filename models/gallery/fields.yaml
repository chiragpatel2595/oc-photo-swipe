fields:
    title:
        label: chiragpatel.photoswipe::lang.galleries.title
        span: left
        type: text

    slug:
        label: chiragpatel.photoswipe::lang.galleries.slug
        span: right
        preset:
            field: title
            type: slug
        type: text

    description:
        label: chiragpatel.photoswipe::lang.galleries.description
        type: textarea
        size: small
        span: full

    layout:
        label: chiragpatel.photoswipe::lang.galleries.layout
        type: dropdown
        span: left
        options:
            grid: Grid
            masonry: Masonry
            justified: Justified
            slider: Slider

    is_published:
        label: chiragpatel.photoswipe::lang.galleries.is_published
        span: left
        type: checkbox

    published_at:
        label: chiragpatel.photoswipe::lang.galleries.published_at
        span: left
        type: datepicker
        mode: datetime
        trigger:
            action: enable
            field: is_published
            condition: checked

tabs:
    fields:
        items:
            label: chiragpatel.photoswipe::lang.gallery_items.tab
            type: partial
            path: $/chiragpatel/photoswipe/controllers/galleries/_relation_items.htm
            tab: chiragpatel.photoswipe::lang.gallery_items.tab

        cover:
            label: chiragpatel.photoswipe::lang.galleries.cover
            mode: image
            imageWidth: 500
            imageHeight: 350
            useCaption: true
            thumbOptions:
                mode: crop
                extension: auto
            span: auto
            type: fileupload
            tab: chiragpatel.photoswipe::lang.galleries.album_tab

        images:
            label: chiragpatel.photoswipe::lang.galleries.images_legacy
            mode: image
            imageWidth: 250
            imageHeight: 250
            useCaption: true
            thumbOptions:
                mode: crop
                extension: auto
            span: auto
            type: fileupload
            tab: chiragpatel.photoswipe::lang.galleries.images_legacy
            comment: chiragpatel.photoswipe::lang.galleries.images_legacy_comment
