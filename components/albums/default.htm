<div class="pswp-albums">
    {% for album in albums %}
        <div class="pswp-album">
            <a href="{{ album.url }}" class="pswp-album__link">
                {% if album.cover %}
                    <img src="{{ album.cover.getThumb(400, 250, {mode: 'crop'}) }}"
                         alt="{{ album.title }}"
                         loading="lazy"
                    />
                {% elseif album.images.count %}
                    <img src="{{ album.images.first.getThumb(400, 250, {mode: 'crop'}) }}"
                         alt="{{ album.title }}"
                         loading="lazy"
                    />
                {% endif %}
                <div class="pswp-album__title">{{ album.title }}</div>
            </a>
        </div>
    {% endfor %}
</div>
